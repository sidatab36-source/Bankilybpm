<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Bankily | بنكيلي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:'Cairo',sans-serif;background:#fff;overflow-x:hidden}
#app{width:100%;height:100%;display:flex;justify-content:center;align-items:flex-start}
.phone{width:100%;max-width:430px;min-height:100vh;background:#fff;display:flex;flex-direction:column;position:relative;padding-bottom:60px}

/* Teal top bar matching image */
.top-bar{background:#0097A7;height:55px;flex-shrink:0;width:100%;border-bottom-left-radius:25px;border-bottom-right-radius:25px;margin-bottom:20px}

/* Body container */
.body{flex:1;display:flex;flex-direction:column;padding:0 35px}

/* Logo positioning */
.logo-bankily{display:flex;justify-content:center;margin:10px 0 35px}
.logo-bankily img{width:220px;max-width:80%;object-fit:contain}

/* Field group arranged according to the design layout */
.field{margin-bottom:30px;display:flex;flex-direction:column}
.field-label{font-size:15px;font-weight:700;color:#000;text-align:right;margin-bottom:12px;padding-right:5px}

/* Input rows matching the plain underline look in the image */
.input-row{display:flex;flex-direction:row-reverse;align-items:center;border-bottom:2.5px solid #555;padding-bottom:5px;position:relative}
.input-row input{flex:1;border:none;outline:none;font-family:'Cairo',sans-serif;font-size:16px;color:#000;background:transparent;text-align:right;direction:rtl;padding:0 5px}
.input-row .input-icon{width:32px;height:32px;flex-shrink:0;color:#000;margin-left:5px}

/* PIN row adjustments for spacing and dash lengths */
.pin-row{display:flex;flex-direction:row-reverse;align-items:center;position:relative}
.pin-dashes{flex:1;display:flex;gap:14px;justify-content:flex-end;direction:ltr}
.pin-dashes input {
  width: 32px;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  border: none;
  border-bottom: 2.5px solid #555;
  outline: none;
  background: transparent;
  font-family: 'Cairo', sans-serif;
  color: #000;
  padding-bottom: 2px;
  direction: ltr;
  caret-color: #000;
}
.pin-icon{width:32px;height:32px;flex-shrink:0;color:#000;margin-left:15px}

/* Action Links adjusted to match the positions on screen */
.link-forgot{font-size:13px;font-weight:600;color:#000;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Cairo',sans-serif;text-align:right;margin-top:8px;align-self:flex-start}
.link-register{font-size:14px;font-weight:700;color:#000;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Cairo',sans-serif;text-align:center;margin:50px auto 20px;width:100%}

/* Spacer */
.spacer{flex:1;min-height:30px}

/* Yellow Full Width Button at the absolute bottom */
.btn-wrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:100}
.btn{height:55px;background:#FFC107;border:none;width:100%;font-family:'Cairo',sans-serif;font-size:22px;font-weight:700;color:#fff;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.85}

/* Screens toggling logic */
.screen{display:none;flex-direction:column;width:100%}
.screen.active{display:flex}
.hide{display:none!important}

/* OTP Screen layout alignment */
.otp-hdr{background:#0097A7;height:55px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;position:relative}
.otp-hdr-back{background:none;border:none;cursor:pointer;color:#fff;font-size:28px;line-height:1;padding:0;position:absolute;right:14px;transform:rotate(180deg)}
.otp-hdr-title{position:absolute;left:50%;transform:translateX(-50%);color:#fff;font-size:18px;font-weight:700}
.otp-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 24px 16px}
.otp-title{font-size:18px;font-weight:700;color:#000;text-align:center;line-height:1.6;margin:20px 0 30px}
.otp-row{display:flex;gap:18px;justify-content:center;direction:ltr;margin-bottom:28px}
.otp-row input{width:52px;height:56px;text-align:center;font-size:26px;font-weight:700;font-family:'Cairo',sans-serif;border:none;border-bottom:2px solid #ccc;outline:none;background:transparent;color:#000;transition:border-color .2s;caret-color:#000;direction:ltr}
.otp-row input:focus{border-color:#0097A7}
.otp-row input.bad{border-color:#e74c3c}
.cd-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:24px}
.cd-text{text-align:center;color:#555;font-size:14px;line-height:1.7}
.cd-time{font-weight:700;color:#000;font-size:17px}
.otp-link{font-size:13px;color:#555;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Cairo',sans-serif;margin-bottom:20px}

/* Error styles */
.errmsg{color:#e74c3c;font-size:13px;text-align:right;margin-top:6px;min-height:16px}
.warning-msg{background:#fce4e4;border:1px solid #f5c2c2;border-radius:8px;padding:12px;margin-top:10px;display:none;gap:10px;align-items:flex-start;text-align:right;font-size:13px;color:#333;line-height:1.5}
.warning-msg::before{content:'!';background:#e74c3c;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;font-size:16px}
.warning-msg.show{display:flex}

#ph{direction:rtl!important;text-align:right!important}
</style>
</head>
<body>
<div id="app">
<div class="phone">

<div id="pg-login" class="screen active">
  <div class="top-bar"></div>
  <div class="body">

    <div class="logo-bankily">
      <img src="logo_bankily.jpeg" alt="Bankily بنكيلي"/>
    </div>

    <div class="field">
      <label class="field-label">اسم المستخدم أو رقم الهاتف</label>
      <div class="input-row" id="row-ph">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <input type="tel" id="ph" inputmode="numeric" maxlength="8" placeholder="" autocomplete="off"/>
      </div>
      <div class="errmsg" id="err-ph"></div>
      <div class="warning-msg" id="warn-ph">رقم الهاتف غير تابع لشركات الاتصال المعتمدة (موريتل، ماتل، شنقيتل)</div>
    </div>

    <div class="field">
      <label class="field-label">الرقم السري</label>
      <div class="pin-row" id="row-pin">
        <svg class="pin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <div class="pin-dashes">
          <input type="password" inputmode="numeric" maxlength="1" class="pin-field" id="p3"/>
          <input type="password" inputmode="numeric" maxlength="1" class="pin-field" id="p2"/>
          <input type="password" inputmode="numeric" maxlength="1" class="pin-field" id="p1"/>
          <input type="password" inputmode="numeric" maxlength="1" class="pin-field" id="p0"/>
        </div>
      </div>
      <div class="errmsg" id="err-pin"></div>
    </div>

    <button class="link-forgot" onclick="void(0)">نسيت الرقم السري؟</button>

    <div class="spacer"></div>
    <button class="link-register" onclick="void(0)">مستخدم جديد ؟ سجل الآن!</button>
  </div>
  <div class="btn-wrap">
    <button class="btn" onclick="login()">تسجيل الدخول</button>
  </div>
</div>

<div id="pg-otp" class="screen hide">
  <div class="otp-hdr">
    <button class="otp-hdr-back" onclick="back()">&#8250;</button>
    <div class="otp-hdr-title">رمز التحقق</div>
  </div>
  <div class="otp-body">
    <div class="otp-title">أدخل رمز التأكيد المرسل إلى هاتفك المحمول</div>
    <div class="otp-row">
      <input type="text" inputmode="numeric" maxlength="1" id="o0"/>
      <input type="text" inputmode="numeric" maxlength="1" id="o1"/>
      <input type="text" inputmode="numeric" maxlength="1" id="o2"/>
      <input type="text" inputmode="numeric" maxlength="1" id="o3"/>
    </div>
    <div class="cd-wrap">
      <div class="cd-text">
        تنتهي صلاحية رمز التأكيد خلال<br/>
        <span class="cd-time" id="cd">4 دقائق 59 ثاني</span>
      </div>
    </div>
    <button class="otp-link" onclick="resetOtp()">إعادة إرسال رمز التأكيد</button>
    <div class="spacer"></div>
  </div>
  <div class="btn-wrap">
    <button class="btn" onclick="verify()">التحقق</button>
  </div>
</div>

</div>
</div>

<script>
function setupStrictLengthValidation(inputElement, maxLength) {
  inputElement.addEventListener('keydown', function(e) {
    const isControlKey = e.key === 'Backspace' || e.key === 'Delete' || e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Tab';
    const isNumber = /^[0-9]$/.test(e.key);

    if (isControlKey) return;
    if (!isNumber) { e.preventDefault(); return; }

    if (this.value.length >= maxLength) {
      e.preventDefault();
    }
  });

  inputElement.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
    if (this.value.length > maxLength) {
      this.value = this.value.slice(0, maxLength);
    }
  });
}

var P = [0,1,2,3].map(function(i){return document.getElementById('p'+i);});
P.forEach(function(el,i){
  setupStrictLengthValidation(el, 1);

  el.addEventListener('focus', function() {
    if (this.value !== '') return;
    for (let j = 0; j < P.length; j++) {
      if (P[j].value === '') {
        if (j !== i) P[j].focus();
        break;
      }
    }
  });

  el.addEventListener('input',function(){
    el.value=el.value.replace(/[^0-9]/g,'');
    document.getElementById('err-pin').textContent='';
    document.getElementById('row-pin').classList.remove('bad');
    if(el.value && i < 3) P[i+1].focus();
  });

  el.addEventListener('keydown',function(e){
    if(e.key==='Backspace'){
      if(el.value.length>0){
        el.value='';
      }else if(i>0){
        P[i-1].focus();
      }
      e.preventDefault();
    }
  });
});

var phEl=document.getElementById('ph');
setupStrictLengthValidation(phEl, 8);
phEl.addEventListener('input',function(){
  this.value=this.value.replace(/[^0-9]/g,'');
  document.getElementById('err-ph').textContent='';
  document.getElementById('row-ph').classList.remove('bad');
  checkPhoneOperator();
});

function checkPhoneOperator(){
  var ph=phEl.value.trim();
  var warnEl=document.getElementById('warn-ph');
  if(ph.length===8){
    var firstDigit=ph.charAt(0);
    if(firstDigit!=='2'&&firstDigit!=='4'&&firstDigit!=='6'){
      warnEl.classList.add('show');
    }else{
      warnEl.classList.remove('show');
    }
  }else{
    warnEl.classList.remove('show');
  }
}

function login(){
  var ph=phEl.value.trim();
  var pin=P.map(function(p){return p.value;}).join('');
  var ok=true;
  if(ph.length!==8){
    document.getElementById('err-ph').textContent='يجب أن يتكون رقم الهاتف من 8 أرقام بالضبط';
    document.getElementById('row-ph').classList.add('bad');
    ok=false;
  }
  if(pin.length!==4){
    document.getElementById('err-pin').textContent='يجب أن يتكون الرقم السري من 4 أرقام بالضبط';
    document.getElementById('row-pin').classList.add('bad');
    ok=false;
  }

  if(ok) showOtp();
}

var O=[0,1,2,3].map(function(i){return document.getElementById('o'+i);});
O.forEach(function(el,i){
  setupStrictLengthValidation(el, 1);

  el.addEventListener('focus', function() {
    if (this.value !== '') return;
    for (let j = 0; j < O.length; j++) {
      if (O[j].value === '') {
        if (j !== i) O[j].focus();
        break;
      }
    }
  });

  el.addEventListener('input',function(){
    el.value=el.value.replace(/[^0-9]/g,'');
    el.classList.remove('bad');
    if(el.value && i < 3) O[i+1].focus();
  });

  el.addEventListener('keydown',function(e){
    if(e.key==='Backspace'){
      if(el.value.length>0){
        el.value='';
      }else if(i>0){
        O[i-1].focus();
      }
      e.preventDefault();
    }
  });
});

function verify(){
  var code=O.map(function(o){return o.value;}).join('');
  if(code.length!==4){
    O.forEach(function(o){o.classList.add('bad');});
    return;
  }
  alert('تمت محاكاة التحقق بنجاح محلياً!');
}

function showOtp(){
  document.getElementById('pg-login').classList.remove('active');
  document.getElementById('pg-otp').classList.add('active');
  O.forEach(function(o){o.value='';o.classList.remove('bad');});
  O[0].focus();
  startTimer();
}

function back(){
  document.getElementById('pg-otp').classList.remove('active');
  document.getElementById('pg-login').classList.add('active');
  clearInterval(T);
}

var TOTAL=299, left=TOTAL, T=null;
function tick(){
  var m=Math.floor(left/60), s=left%60;
  document.getElementById('cd').textContent=m+' دقائق '+String(s).padStart(2,'0')+' ثاني';
  if(left<=0){clearInterval(T);document.getElementById('cd').textContent='انتهت الصلاحية';}
  else left--;
}
function startTimer(){clearInterval(T);left=TOTAL;tick();T=setInterval(tick,1000);}
function resetOtp(){O.forEach(function(o){o.value='';o.classList.remove('bad');});startTimer();O[0].focus();}
</script>
</body>
</html>
