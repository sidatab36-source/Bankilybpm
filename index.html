<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية / بنكيلي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; background-color: #f4f7f6; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; min-height: 100vh; }
        .wrapper { width: 100%; max-width: 450px; background: #fff; padding-bottom: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .form-container { padding: 20px; text-align: right; }
        .label { font-weight: bold; margin-bottom: 8px; display: block; font-size: 15px; color: #333; }
        
        /* إزالة الفراغات غير الضرورية */
        .pin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .forgot-pass { font-size: 14px; color: #1a5e20; font-weight: bold; cursor: pointer; text-decoration: underline; }

        .input-box { position: relative; border: 1.5px solid #1a5e20; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; padding: 5px 15px; }
        input { border: none; width: 100%; font-size: 17px; padding: 12px; outline: none; background: transparent; font-family: 'Cairo'; }
        
        .register-container { text-align: center; margin-top: 10px; }
        .btn-yellow { background-color: #ffc107; color: #000; border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 19px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="p1" class="form-container">
        <label class="label">رقم الهاتف المربوط بالحساب *</label>
        <div class="input-box">
            <input type="tel" id="tel" placeholder="رقم الهاتف" maxlength="8">
        </div>

        <div class="pin-header">
            <label class="label">الرمز السري (PIN) *</label>
            <span class="forgot-pass">نسيت الرقم السري؟</span>
        </div>
        <div class="input-box">
            <input type="password" id="pin" placeholder="أدخل الرمز السري" maxlength="4">
        </div>

        <div class="register-container">
            <p style="font-size: 15px; font-weight: bold;">مستخدم جديد ؟ سجل الآن!</p>
            <button class="btn-yellow" onclick="toStep2()">تسجيل الدخول</button>
        </div>
    </div>
</div>

<script>
    function toStep2() { 
        alert("جاري التحويل..."); 
    }
</script>
</body>
</html>
