<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankily - بنكيلي</title>
    <style>
        :root {
            --primary-teal: #0093a2; /* درجة الفيروزي الأصلية بالتطبيق */
            --primary-yellow: #f8ba00; /* درجة الأصفر الأصلية للشريط السفلي */
            --bg-white: #ffffff;
            --text-gray: #7d7d7d;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية شاشة الهاتف */
        .app-container {
            width: 360px;
            height: 740px;
            background-color: var(--bg-white);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* شريط العنوان العلوي */
        .app-header {
            background-color: var(--primary-teal);
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            font-size: 1.25rem;
            font-weight: 500;
        }

        .app-header .back-arrow {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.6rem;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        /* المحتوى الداخلي */
        .app-content {
            flex: 1;
            padding: 40px 30px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الشعار */
        .brand-logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo h1 {
            color: var(--primary-teal);
            font-size: 2.6rem;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .brand-logo p {
            color: var(--text-gray);
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-top: -5px;
            font-weight: 500;
        }

        /* مجموعات الإدخال */
        .input-group {
            width: 100%;
            margin-bottom: 30px;
            position: relative;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 15px;
        }

        /* حقل الهاتف المستمر */
        .phone-input-wrapper {
            position: relative;
            width: 100%;
        }

        .main-input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #222;
            padding: 8px 5px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            color: #333;
            background: transparent;
        }

        /* حاوية الخانات المنفصلة (للرقم السري والـ OTP) */
        .split-inputs-container {
            display: flex;
            justify-content: space-between;
            width: 75%;
            margin: 10px auto 0 auto;
            direction: ltr; /* لجعل الانتقال للأرقام من اليسار لليمين منطقياً */
        }

        .split-box {
            width: 35px;
            height: 35px;
            border: none;
            border-bottom: 2px solid #222;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            outline: none;
            background: transparent;
        }

        /* أيقونات المستخدم والقفل الجانبية */
        .field-icon {
            position: absolute;
            left: 0;
            bottom: 10px;
            width: 22px;
            height: 22px;
            opacity: 0.8;
        }

        /* الروابط المساعدة */
        .helper-links {
            margin-top: 15px;
            text-align: center;
            width: 100%;
            line-height: 2.2;
        }

        .helper-links a {
            color: #222;
            text-decoration: underline;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* تخصيصات واجهة OTP */
        .otp-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
            text-align: center;
            line-height: 1.6;
            margin-top: 15px;
            margin-bottom: 40px;
        }

        .otp-timer-label {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .otp-timer-countdown {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-teal);
            margin-bottom: 25px;
        }

        .green-circle {
            width: 32px;
            height: 32px;
            border: 4px solid #00ff00;
            border-radius: 50%;
            margin-bottom: 30px;
        }

        /* الزر السفلي الأصفر الثابت */
        .footer-button {
            background-color: var(--primary-yellow);
            color: #ffffff;
            border: none;
            width: 100%;
            height: 60px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            margin-top: auto;
        }

        .footer-button:active {
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="app-header">
            <span class="back-arrow" id="backArrow" onclick="switchToLogin()">&#12296;</span>
            <span id="titleText">تسجيل الدخول</span>
        </div>

        <div id="loginSection" class="app-content">
            <div class="brand-logo">
                <h1>Bankily</h1>
                <p>PAR BPM</p>
            </div>

            <div class="input-group">
                <label>اسم المستخدم أو رقم الهاتف</label>
                <div class="phone-input-wrapper">
                    <input type="text" id="usernameInput" class="main-input" maxlength="8" oninput="cleanNumberInput(this)">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5.5 21a8.5 8.5 0 0 1 13 0"/></svg>
                </div>
            </div>

            <div class="input-group">
                <label>الرقم السري</label>
                <div class="split-inputs-container">
                    <input type="password" class="split-box pin-box" maxlength="1" oninput="handleBoxNavigation(this, '.pin-box', 0)">
                    <input type="password" class="split-box pin-box" maxlength="1" oninput="handleBoxNavigation(this, '.pin-box', 1)">
                    <input type="password" class="split-box pin-box" maxlength="1" oninput="handleBoxNavigation(this, '.pin-box', 2)">
                    <input type="password" class="split-box pin-box" maxlength="1" oninput="handleBoxNavigation(this, '.pin-box', 3)">
                </div>
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="bottom: 5px;"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </div>

            <div class="helper-links">
                <a href="#">نسيت الرقم السري ؟</a><br>
                <a href="#">مستخدم جديد ؟ سجل الآن!</a>
            </div>
        </div>

        <div id="otpSection" class="app-content hidden">
            <p class="otp-title">أدخل رمز التأكيد المرسل إلى<br>هاتفك المحمول</p>

            <div class="split-inputs-container" style="margin-bottom: 35px;">
                <input type="text" class="split-box otp-box" maxlength="1" oninput="handleBoxNavigation(this, '.otp-box', 0)">
                <input type="text" class="split-box otp-box" maxlength="1" oninput="handleBoxNavigation(this, '.otp-box', 1)">
                <input type="text" class="split-box otp-box" maxlength="1" oninput="handleBoxNavigation(this, '.otp-box', 2)">
                <input type="text" class="split-box otp-box" maxlength="1" oninput="handleBoxNavigation(this, '.otp-box', 3)">
            </div>

            <p class="otp-timer-label">تنتهي صلاحية رمز التأكيد خلال</p>
            <p class="otp-timer-countdown">4 دقائق 58 ثواني</p>

            <div class="green-circle"></div>

            <div class="helper-links">
                <a href="#" style="color: #444; font-weight: normal;">إعادة إرسال رمز التأكيد</a>
            </div>
        </div>

        <button class="footer-button" id="submitBtn" onclick="onFooterButtonClick()">تسجيل الدخول</button>

    </div>

    <script>
        // تنظيف مدخلات حقل الهاتف
        function cleanNumberInput(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        // حركة الانتقال التلقائي الذكية للخانات المنفصلة (تدعم الرقم السري والـ OTP)
        function handleBoxNavigation(current, className, currentIndex) {
            current.value = current.value.replace(/[^0-9]/g, '');
            const fields = document.querySelectorAll(className);
            
            if (current.value.length === 1 && currentIndex < 3) {
                fields[currentIndex + 1].focus();
            }
        }

        // دعم زر الـ Backspace للرجوع للخلف والمسح في كل الخانات المنفصلة
        function setupBackspaceListener(className) {
            const fields = document.querySelectorAll(className);
            fields.forEach((field, index) => {
                field.addEventListener('keydown', (e) => {
                    if (e.key === "Backspace" && field.value.length === 0 && index > 0) {
                        fields[index - 1].focus();
                    }
                });
            });
        }

        // تشغيل مستمعات المسح عند تحميل الصفحة
        setupBackspaceListener('.pin-box');
        setupBackspaceListener('.otp-box');

        // معالجة الضغط على الزر الرئيسي الأصفر
        function onFooterButtonClick() {
            const loginSection = document.getElementById('loginSection');
            const otpSection = document.getElementById('otpSection');
            const titleText = document.getElementById('titleText');
            const backArrow = document.getElementById('backArrow');
            const submitBtn = document.getElementById('submitBtn');

            if (!loginSection.classList.contains('hidden')) {
                const userVal = document.getElementById('usernameInput').value;
                
                // تجميع الرقم السري من الـ 4 خانات
                let pinVal = "";
                document.querySelectorAll('.pin-box').forEach(box => pinVal += box.value);

                if (userVal.length !== 8) {
                    alert("يجب إدخال رقم الهاتف المكون من 8 أرقام.");
                    return;
                }
                if (pinVal.length !== 4) {
                    alert("يجب إدخال الرقم السري كاملاً المكون من 4 خانات.");
                    return;
                }

                // التحويل لواجهة الـ OTP
                loginSection.classList.add('hidden');
                otpSection.classList.remove('hidden');
                titleText.innerText = "رمز التحقق";
                backArrow.style.display = "block";
                submitBtn.innerText = "التحقق";
            } else {
                // تجميع قيم الـ OTP
                let otpCode = "";
                document.querySelectorAll('.otp-box').forEach(box => otpCode += box.value);

                if (otpCode.length !== 4) {
                    alert("الرجاء تعبئة حقل الـ OTP المكون من 4 أرقام.");
                    return;
                }

                alert("تم التحقق بنجاح! جاري تسجيل الدخول...");
            }
        }

        // العودة لواجهة تسجيل الدخول
        function switchToLogin() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('otpSection').classList.add('hidden');
            document.getElementById('titleText').innerText = "تسجيل الدخول";
            document.getElementById('backArrow').style.display = "none";
            document.getElementById('submitBtn').innerText = "تسجيل الدخول";
        }
    </script>
</body>
</html>
