<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة تطبيق بنكيلي - Bankily</title>
    <style>
        :root {
            --primary-blue: #0097a7;
            --secondary-yellow: #ffc107;
            --background-gray: #f8f9fa;
            --text-dark: #333;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية الهاتف الذكي */
        .phone-container {
            width: 360px;
            height: 740px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* الشريط العلوي */
        .header-bar {
            background-color: var(--primary-blue);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            position: relative;
        }

        .header-bar .back-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.4rem;
            display: none; /* يظهر فقط في واجهة الـ OTP */
        }

        /* محتوى النموذج */
        .content {
            flex: 1;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-area h2 {
            color: var(--primary-blue);
            font-size: 2.2rem;
        }
        .logo-sub {
            color: #777;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .form-group {
            width: 100%;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .input-control {
            width: 100%;
            padding: 12px;
            border: none;
            border-bottom: 2px solid #ccc;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-control:focus {
            border-bottom-color: var(--primary-blue);
        }

        /* روابط المساعدة */
        .links-group {
            margin-top: 15px;
            text-align: center;
            width: 100%;
        }

        .links-group a {
            color: var(--text-dark);
            text-decoration: underline;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        /* مربعات الـ OTP منفصلة لتطابق الصورة */
        .otp-inputs {
            display: flex;
            justify-content: space-between;
            width: 80%;
            margin: 40px 0 20px 0;
            direction: ltr; /* لجعل الكتابة والانتقال من اليسار لليمين منطقياً للأرقام */
        }

        .otp-box {
            width: 45px;
            height: 45px;
            border: none;
            border-bottom: 2px solid #aaa;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        .otp-box:focus {
            border-bottom-color: var(--primary-blue);
        }

        .timer-text {
            font-size: 0.9rem;
            color: #555;
            margin-top: 10px;
            text-align: center;
        }

        /* الزر السفلي الثابت الأصفر */
        .action-btn {
            background-color: var(--secondary-yellow);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            border: none;
            width: 100%;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: auto; /* يدفعه لأسفل الحاوية */
        }

        .action-btn:hover {
            background-color: #e0a800;
        }

        /* إخفاء الواجهات */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <div class="header-bar">
            <span class="back-btn" id="backBtn" onclick="showLoginView()">&#10094;</span>
            <span id="headerTitle">تسجيل الدخول</span>
        </div>

        <div id="loginView" class="content">
            <div class="logo-area">
                <h2>Bankily</h2>
                <div class="logo-sub">PAR BPM</div>
            </div>

            <div class="form-group">
                <label>اسم المستخدم أو رقم الهاتف</label>
                <input type="text" id="phoneInput" class="input-control" maxlength="8" placeholder="من 8 أرقام" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>

            <div class="form-group">
                <label>الرقم السري</label>
                <input type="password" id="pinInput" class="input-control" maxlength="4" placeholder="من 4 أرقام" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>

            <div class="links-group">
                <a href="#">نسيت الرقم السري ؟</a><br>
                <a href="#">مستخدم جديد ؟ سجل الآن!</a>
            </div>
        </div>

        <div id="otpView" class="content hidden">
            <p style="text-align: center; font-weight: bold; margin-top: 20px; line-height: 1.6;">
                أدخل رمز التأكيد المرسل إلى<br>هاتفك المحمول
            </p>

            <div class="otp-inputs">
                <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 1)">
                <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 2)">
                <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 3)">
                <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 4)">
            </div>

            <p class="timer-text">تنتهي صلاحية رمز التأكيد خلال</p>
            <p class="timer-text" style="color: var(--primary-blue); font-weight: bold;">4 دقائق 58 ثواني</p>

            <div class="links-group" style="margin-top: 30px;">
                <a href="#" style="color: #666;">إعادة إرسال رمز التأكيد</a>
            </div>
        </div>

        <button class="action-btn" id="mainActionBtn" onclick="handleMainAction()">تسجيل الدخول</button>

    </div>

    <script>
        // التحويل بين الواجهات
        function handleMainAction() {
            const loginView = document.getElementById('loginView');
            const otpView = document.getElementById('otpView');
            const headerTitle = document.getElementById('headerTitle');
            const backBtn = document.getElementById('backBtn');
            const mainActionBtn = document.getElementById('mainActionBtn');

            // إذا كنا في واجهة تسجيل الدخول، نتحقق من البيانات ثم ننتقل للـ OTP
            if (!loginView.classList.contains('hidden')) {
                const phone = document.getElementById('phoneInput').value;
                const pin = document.getElementById('pinInput').value;

                if(phone.length !== 8) {
                    alert("الرجاء إدخال رقم هاتف صحيح مكون من 8 أرقام.");
                    return;
                }
                if(pin.length !== 4) {
                    alert("الرجاء إدخال رقم سري مكون من 4 أرقام.");
                    return;
                }

                // الانتقال للواجهة الثانية
                loginView.classList.add('hidden');
                otpView.classList.remove('hidden');
                headerTitle.innerText = "رمز التحقق";
                backBtn.style.display = "block";
                mainActionBtn.innerText = "التحقق";
            } else {
                // إذا كنا في واجهة الـ OTP وضغطنا على زر التحقق
                let otpValue = "";
                document.querySelectorAll('.otp-box').forEach(box => otpValue += box.value);
                
                if(otpValue.length !== 4) {
                    alert("الرجاء إدخال رمز التحقق كاملاً (4 أرقام).");
                    return;
                }
                
                alert("تم التحقق بنجاح! جاري الدخول إلى حسابك...");
            }
        }

        // العودة للواجهة الأولى عند الضغط على سهم العودة
        function showLoginView() {
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('otpView').classList.add('hidden');
            document.getElementById('headerTitle').innerText = "تسجيل الدخول";
            document.getElementById('backBtn').style.display = "none";
            document.getElementById('mainActionBtn').innerText = "تسجيل الدخول";
        }

        // وظيفة الانتقال التلقائي بين خانات الـ OTP عند الكتابة
        function moveNext(current, index) {
            // منع إدخال أي شيء عدا الأرقام
            current.value = current.value.replace(/[^0-9]/g, '');
            
            const boxes = document.querySelectorAll('.otp-box');
            if (current.value.length === 1 && index < 4) {
                boxes[index].focus();
            }
        }

        // إضافة دعم للـ Backspace للرجوع للخلف أثناء مسح أرقام الـ OTP
        document.querySelectorAll('.otp-box').forEach((box, idx) => {
            box.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && box.value.length === 0 && idx > 0) {
                    document.querySelectorAll('.otp-box')[idx - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
