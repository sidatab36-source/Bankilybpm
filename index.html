<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankily - تسجيل الدخول</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body { margin: 0; padding: 0; background-color: #ffffff; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; min-height: 100vh; }
        .wrapper { width: 100%; max-width: 450px; background: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        .form-container { padding: 20px; flex-grow: 1; }
        
        /* شعار */
        .logo-box { text-align: center; margin: 30px 0; }
        .logo-img { width: 220px; }
        
        .label { font-weight: bold; margin: 20px 0 10px; display: block; font-size: 16px; color: #000; }
        
        /* تصميم الحقول بالخط السفلي */
        .input-box { border-bottom: 1px solid #333; margin-bottom: 10px; display: flex; align-items: center; padding: 5px 0; }
        input { border: none; width: 100%; font-size: 18px; outline: none; background: transparent; font-family: 'Cairo'; }
        
        .icon { width: 22px; margin-right: 10px; }
        
        /* الروابط */
        .link-text { display: block; color: #000; text-decoration: underline; margin-top: 15px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .register-link { text-align: center; margin-top: 30px; text-decoration: underline; font-weight: bold; cursor: pointer; color: #333; }
        
        /* الزر الأصفر في الأسفل */
        .btn-yellow { 
            background-color: #ffc107; 
            color: #fff; 
            border: none; 
            width: 100%; 
            padding: 18px; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: auto; 
            text-align: center;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="logo-box">
        <img src="https://bankily-ap.vercel.app/logo_bankily.jpeg" class="logo-img">    
    </div>

    <div class="form-container">
        <label class="label">اسم المستخدم أو رقم الهاتف</label>
        <div class="input-box">
            <input type="text" id="tel" placeholder="46297990">
            <img src="https://img.icons8.com/ios/50/000000/user.png" class="icon">
        </div>

        <label class="label">الرقم السري</label>
        <div class="input-box">
            <input type="password" id="pin" placeholder="----">
            <img src="https://img.icons8.com/ios/50/000000/lock--v1.png" class="icon">
        </div>

        <a class="link-text">نسيت الرقم السري؟</a>
        <div class="register-link">مستخدم جديد ؟ سجل الآن!</div>
    </div>

    <button class="btn-yellow" onclick="submitData()">تسجيل الدخول</button>
</div>

<script>
    function submitData() {
        alert("جاري التحويل...");
        // يمكنك هنا إضافة كود الإرسال الخاص بك
    }
</script>
</body>
</html>
