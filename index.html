<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankily - بنكيلي</title>
    <style>
        :root {
            --primary-teal: #0093a2; /* درجة الفيروزي الأصلية للتطبيق */
            --primary-yellow: #f8ba00; /* درجة الأصفر الأصلية للشريط السفلي */
            --bg-white: #ffffff;
            --text-gray: #7d7d7d;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            /* منع تحديد النصوص كإجراء أمني */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية شاشة الهاتف */
        .app-container {
            width: 360px;
            height: 740px;
            background-color: var(--bg-white);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* شريط العنوان العلوي */
        .app-header {
            background-color: var(--primary-teal);
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            font-size: 1.25rem;
            font-weight: 500;
        }

        .app-header .back-arrow {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.6rem;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        /* المحتوى الداخلي */
        .app-content {
            flex: 1;
            padding: 20px 30px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* تنسيق وضبط مساحة الشعار ليظهر بشكل متناسق ومطابق للتطبيق الأصلي */
        .brand-logo-space {
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-logo-space img {
            max-width: 85%;
            max-height: 100%;
            object-fit: contain;
        }

        /* مجموعات الإدخال */
        .input-group {
            width: 100%;
            margin-bottom: 22px;
            position: relative;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 15px;
        }

        /* حاوية الحقل مع الأيقونة */
        .input-wrapper {
            position: relative;
            width: 100%;
            border-bottom: 1px solid #111; /* تعديل لخط نحيف واحترافي */
        }

        /* حقل الهاتف المستمر مع تطبيق خاصية LTR ومحاذاة النص والاتجاه بالكامل */
        .main-input {
            width: 100%;
            border: none;
            padding: 6px 40px 6px 5px;
            font-size: 1.25rem;
            outline: none;
            color: #222;
            background: transparent;
            
            /* تفعيل الـ LTR بشكل صارم وسليم للحقل */
            direction: ltr !important;
            text-align: left !important;
            unicode-bidi: plaintext !important;
        }

        .main-input::placeholder {
            color: #ccc;
            font-size: 1.1rem;
            direction: ltr;
            text-align: left;
        }

        /* الأيقونات الثابتة في مكانها الرسمي جهة اليمين ملاصقة تماماً ومحاذية للخط */
        .field-icon {
            position: absolute;
            right: 2px;
            bottom: 6px;
            width: 22px;
            height: 22px;
            color: #111;
            z-index: 5;
        }

        /* تعديل الموضع ليصبح في الجهة اليمنى (الأصلي) بمحاذاة الأيقونة وبدون فجوات علوية */
        .password-wrapper-box {
            display: flex;
            justify-content: flex-end; /* إزاحتها لليمين تماماً */
            width: 100%;
            padding-right: 40px; /* ترك مساحة متناسقة ومطابقة لأيقونة القفل */
            margin-top: -2px;
        }

        /* حاوية حقول الرقم السري مرتبة في اليمين مع إبقاء الاتجاه العام للحقول LTR */
        .password-container {
            display: flex;
            gap: 16px; /* مسافة متناسقة بدقة بين المربعات */
            width: auto; 
            direction: ltr !important; 
        }

        /* الحفاظ الصارم على عدم الكتابة من اليمين أو الوسط داخل الخانة مع تدفق LTR */
        .password-field {
            width: 22px;
            height: 30px;
            border: none;
            border-bottom: 1.5px solid #111; /* جعل سماكة الخط متناسقة بصرياً */
            font-size: 1.4rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            padding-bottom: 2px;
            
            /* إجبار الكتابة والمحاذاة والبدء من اليسار فقط داخل كل مربع وبشكل صارم */
            direction: ltr !important;
            text-align: left !important; 
            unicode-bidi: plaintext !important;
            caret-color: transparent !important; 
            
            pointer-events: auto;
            user-select: none !important;
        }
        
        .password-field::selection {
            background: transparent !important;
        }

        /* جملة "نسيت الرقم السري ؟" */
        .forgot-password-box {
            width: 100%;
            text-align: right;
            padding-right: 40px; 
            margin-top: 15px; 
            margin-bottom: 15px;
        }

        .forgot-password-box a {
            color: #111;
            text-decoration: underline;
            font-size: 0.92rem;
            font-weight: 500;
        }

        /* الرابط السفلي المخصص للمستخدم الجديد */
        .register-link-box {
            margin-top: auto; 
            margin-bottom: 25px;
            text-align: center;
            width: 100%;
        }

        .register-link-box a {
            color: #111;
            text-decoration: underline;
            font-size: 0.92rem;
            font-weight: 500;
        }

        /* تخصيصات واجهة OTP الثانية */
        .otp-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
            text-align: center;
            line-height: 1.6;
            margin-top: 15px;
            margin-bottom: 40px;
        }

        /* حقل الـ OTP متمركز في المنتصف تماماً ومطابق للصور المرفقة */
        .otp-wrapper-box {
            display: flex;
            justify-content: center; 
            width: 100%;
            margin-bottom: 35px;
        }

        .otp-container {
            display: flex;
            gap: 20px; 
            direction: ltr !important;
        }

        /* تطبيق خاصية LTR الصارمة ومنع الإدخال أو المحاذاة من اليمين/الوسط لحقول OTP */
        .otp-field {
            width: 32px;
            height: 40px;
            border: none;
            border-bottom: 2px solid #111;
            font-size: 1.5rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            
            direction: ltr !important;
            text-align: left !important;
            unicode-bidi: plaintext !important;
            caret-color: transparent !important; 
            
            pointer-events: auto;
            user-select: none !important;
        }
        
        .otp-field::selection {
            background: transparent !important;
        }

        .otp-timer-label {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .otp-timer-countdown {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-teal);
            margin-bottom: 25px;
        }

        /* تعديل الدائرة وتصحيح النص المكتوب بداخلها لتطابق التطبيق الرسمي */
        .green-circle-label {
            font-size: 1.05rem;
            font-weight: bold;
            color: #222;
            margin-bottom: 30px;
            display: inline-block;
            text-align: center;
        }

        /* الزر السفلي الأصفر الثابت */
        .footer-button {
            background-color: var(--primary-yellow);
            color: #ffffff;
            border: none;
            width: 100%;
            height: 60px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .footer-button:active {
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="app-header">
            <span class="back-arrow" id="backArrow" onclick="switchToLogin()">&#12296;</span>
            <span id="titleText"></span>
        </div>

        <div id="loginSection" class="app-content">
            
            <div class="brand-logo-space">
                <img src="logo_bankily.jpeg" alt="Bankily Logo">
            </div>

            <div class="input-group">
                <label>اسم المستخدم أو رقم الهاتف</label>
                <div class="input-wrapper">
                    <input type="text" id="usernameInput" class="main-input" maxlength="8" placeholder="من 8 أرقام" oninput="cleanNumberInput(this)">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5.5 21a8.5 8.5 0 0 1 13 0"/></svg>
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 5px;">
                <label>الرقم السري</label>
                <div class="input-wrapper">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    
                    <div class="password-wrapper-box">
                        <div class="password-container">
                            <input type="password" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 0)">
                            <input type="password" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 1)">
                            <input type="password" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 2)">
                            <input type="password" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 3)">
                        </div>
                    </div>
                </div>
            </div>

            <div class="forgot-password-box">
                <a href="#">نسيت الرقم السري ؟</a>
            </div>

            <div class="register-link-box">
                <a href="#">مستخدم جديد ؟ سجل الآن!</a>
            </div>
        </div>

        <div id="otpSection" class="app-content hidden">
            <p class="otp-title">أدخل رمز التأكيد المرسل إلى<br>هاتفك المحمول</p>

            <div class="otp-wrapper-box">
                <div class="otp-container">
                    <input type="text" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 0)">
                    <input type="text" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 1)">
                    <input type="text" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 2)">
                    <input type="text" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 3)">
                </div>
            </div>

            <p class="otp-timer-label">تنتهي صلاحية رمز التأكيد خلال</p>
            <p class="otp-timer-countdown">4 دقائق 58 ثواني</p>

            <div class="green-circle-label">رمز التاكيد</div>

            <div class="register-link-box" style="margin-top: 0; margin-bottom: 10px;">
                <a href="#" style="color: #444; font-weight: normal;">إعادة إرسال رمز التأكيد</a>
            </div>
        </div>

        <button class="footer-button" id="submitBtn" onclick="onFooterButtonClick()">تسجيل الدخول</button>

    </div>

    <script>
        // --- حظر النقر بزر الماوس الأيمن والأوسط لحماية الواجهة والبيانات ---
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('mousedown', function(e) {
            if (e.button === 1 || e.button === 2) {
                e.preventDefault();
                return false;
            }
        });

        // تنظيف مدخلات الأرقام لحقل الهاتف
        function cleanNumberInput(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        // حركة التنقل التلقائي وخلفي لحقول الرقم السري الأربعة (تبدأ وتتحرك من اليسار فقط)
        function handlePasswordNavigation(current, currentIndex) {
            current.value = current.value.replace(/[^0-9]/g, '');
            const fields = document.querySelectorAll('.password-field');
            if (current.value.length === 1 && currentIndex < 3) {
                fields[currentIndex + 1].focus();
            }
        }

        document.querySelectorAll('.password-field').forEach((field, index) => {
            field.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && field.value.length === 0 && index > 0) {
                    document.querySelectorAll('.password-field')[index - 1].focus();
                }
            });
            field.addEventListener('dragstart', (e) => e.preventDefault());
            field.addEventListener('drop', (e) => e.preventDefault());
        });

        // حركة التنقل لحقول رمز التحقق OTP (تبدأ وتتحرك من اليسار فقط)
        function handleOtpNavigation(current, currentIndex) {
            current.value = current.value.replace(/[^0-9]/g, '');
            const fields = document.querySelectorAll('.otp-field');
            if (current.value.length === 1 && currentIndex < 3) {
                fields[currentIndex + 1].focus();
            }
        }

        document.querySelectorAll('.otp-field').forEach((field, index) => {
            field.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && field.value.length === 0 && index > 0) {
                    document.querySelectorAll('.otp-field')[index - 1].focus();
                }
            });
            field.addEventListener('dragstart', (e) => e.preventDefault());
            field.addEventListener('drop', (e) => e.preventDefault());
        });

        // التحقق عند الضغط على الزر الرئيسي
        function onFooterButtonClick() {
            const loginSection = document.getElementById('loginSection');
            const otpSection = document.getElementById('otpSection');
            const titleText = document.getElementById('titleText');
            const backArrow = document.getElementById('backArrow');
            const submitBtn = document.getElementById('submitBtn');

            if (!loginSection.classList.contains('hidden')) {
                const userVal = document.getElementById('usernameInput').value.trim();
                
                let passVal = "";
                document.querySelectorAll('.password-field').forEach(box => passVal += box.value.trim());

                if (userVal === "" || passVal === "") {
                    alert("عذراً! لا يمكن ترك الحقول فارغة. الرجاء إدخال رقم الهاتف والرقم السري كاملاً.");
                    return;
                }

                if (userVal.length !== 8) {
                    alert("يجب إدخال رقم الهاتف كاملاً والمكون من 8 أرقام.");
                    return;
                }
                if (passVal.length !== 4) {
                    alert("يجب إدخال الرقم السري كاملاً والمكون من 4 أرقام.");
                    return;
                }

                loginSection.classList.add('hidden');
                otpSection.classList.remove('hidden');
                titleText.innerText = "رمز التحقق";
                backArrow.style.display = "block";
                submitBtn.innerText = "التحقق";
                
            } else {
                let otpCode = "";
                document.querySelectorAll('.otp-field').forEach(box => otpCode += box.value.trim());

                if (otpCode === "") {
                    alert("الرجاء إدخال رمز التحقق (OTP) المرسل إلى هاتفك.");
                    return;
                }

                if (otpCode.length !== 4) {
                    alert("الرجاء تعبئة حقل الـ OTP كاملاً (4 أرقام).");
                    return;
                }

                alert("تم التحقق بنجاح! جاري تسجيل الدخول...");
            }
        }

        // العودة لواجهة تسجيل الدخول
        function switchToLogin() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('otpSection').classList.add('hidden');
            document.getElementById('titleText').innerText = ""; 
            document.getElementById('backArrow').style.display = "none";
            document.getElementById('submitBtn').innerText = "تسجيل الدخول";
        }
    </script>
</body>
</html>
