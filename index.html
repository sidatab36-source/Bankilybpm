<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankily - بنكيلي</title>
    <style>
        :root {
            --primary-teal: #0093a2; /* درجة الفيروزي الأصلية للتطبيق */
            --primary-yellow: #f8ba00; /* درجة الأصفر الأصلية للشريط السفلي */
            --bg-white: #ffffff;
            --text-gray: #7d7d7d;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            /* منع تحديد النصوص كإجراء أمني إضافي */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية شاشة الهاتف */
        .app-container {
            width: 360px;
            height: 740px;
            background-color: var(--bg-white);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* شريط العنوان العلوي */
        .app-header {
            background-color: var(--primary-teal);
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            font-size: 1.25rem;
            font-weight: 500;
        }

        .app-header .back-arrow {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.6rem;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        /* المحتوى الداخلي */
        .app-content {
            flex: 1;
            padding: 40px 30px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الشعار المعزز بالهوية البصرية المتكاملة */
        .brand-logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo h1 {
            color: var(--primary-teal);
            font-size: 2.6rem;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .brand-logo p {
            color: var(--text-gray);
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-top: -5px;
            font-weight: 500;
        }

        /* مجموعات الإدخال */
        .input-group {
            width: 100%;
            margin-bottom: 30px;
            position: relative;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 15px;
        }

        /* حاوية الحقل مع الأيقونة */
        .input-wrapper {
            position: relative;
            width: 100%;
        }

        /* الحقول الرئيسية المستمرة */
        .main-input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #222;
            padding: 8px 45px 8px 5px; /* مساحة إضافية جهة اليمين لحمل الأيقونة */
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            color: #333;
            background: transparent;
        }

        /* دعم LTR لكلمة المرور لمنع مشاكل النجوم والمحاذاة */
        #passwordInput {
            direction: ltr !important;
        }

        .main-input::placeholder {
            color: #b8b8b8;
            font-size: 1.1rem;
            direction: rtl;
        }

        /* إرجاع الأيقونات إلى مكانها الأصلي في الجهة اليمنى (خارج الدائرة الخضراء) */
        .field-icon {
            position: absolute;
            right: 5px;
            bottom: 10px;
            width: 22px;
            height: 22px;
            color: #333;
        }

        /* الروابط المساعدة */
        .helper-links {
            margin-top: 15px;
            text-align: center;
            width: 100%;
            line-height: 2.2;
        }

        .helper-links a {
            color: #222;
            text-decoration: underline;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* تخصيصات واجهة OTP الثانية */
        .otp-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
            text-align: center;
            line-height: 1.6;
            margin-top: 15px;
            margin-bottom: 40px;
        }

        /* حاوية الـ OTP مع دعم LTR */
        .otp-container {
            display: flex;
            justify-content: space-between;
            width: 75%;
            margin-bottom: 35px;
            direction: ltr !important;
        }

        .otp-field {
            width: 40px;
            height: 40px;
            border: none;
            border-bottom: 2px solid #222;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            direction: ltr !important;
        }

        .otp-timer-label {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .otp-timer-countdown {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-teal);
            margin-bottom: 25px;
        }

        .green-circle {
            width: 32px;
            height: 32px;
            border: 4px solid #00ff00;
            border-radius: 50%;
            margin-bottom: 30px;
        }

        /* الزر السفلي الأصفر الثابت */
        .footer-button {
            background-color: var(--primary-yellow);
            color: #ffffff;
            border: none;
            width: 100%;
            height: 60px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            margin-top: auto;
        }

        .footer-button:active {
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="app-header">
            <span class="back-arrow" id="backArrow" onclick="switchToLogin()">&#12296;</span>
            <span id="titleText">تسجيل الدخول</span>
        </div>

        <div id="loginSection" class="app-content">
            <div class="brand-logo">
                <h1>Bankily</h1>
                <p>PAR BPM</p>
            </div>

            <div class="input-group">
                <label>اسم المستخدم أو رقم الهاتف</label>
                <div class="input-wrapper">
                    <input type="text" id="usernameInput" class="main-input" maxlength="8" placeholder="من 8 أرقام" oninput="cleanNumberInput(this)">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5.5 21a8.5 8.5 0 0 1 13 0"/></svg>
                </div>
            </div>

            <div class="input-group">
                <label>الرقم السري</label>
                <div class="input-wrapper">
                    <input type="password" id="passwordInput" class="main-input" maxlength="4" placeholder="من 4 أرقام" oninput="cleanNumberInput(this)">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                </div>
            </div>

            <div class="helper-links">
                <a href="#">نسيت الرقم السري ؟</a><br>
                <a href="#">مستخدم جديد ؟ سجل الآن!</a>
            </div>
        </div>

        <div id="otpSection" class="app-content hidden">
            <p class="otp-title">أدخل رمز التأكيد المرسل إلى<br>هاتفك المحمول</p>

            <div class="otp-container">
                <input type="text" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 1)">
                <input type="text" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 2)">
                <input type="text" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 3)">
                <input type="text" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 4)">
            </div>

            <p class="otp-timer-label">تنتهي صلاحية رمز التأكيد خلال</p>
            <p class="otp-timer-countdown">4 دقائق 58 ثواني</p>

            <div class="green-circle"></div>

            <div class="helper-links">
                <a href="#" style="color: #444; font-weight: normal;">إعادة إرسال رمز التأكيد</a>
            </div>
        </div>

        <button class="footer-button" id="submitBtn" onclick="onFooterButtonClick()">تسجيل الدخول</button>

    </div>

    <script>
        // --- منع النقر بزر الماوس الأيمن والوسطى ---
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('mousedown', function(e) {
            if (e.button === 1 || e.button === 2) {
                e.preventDefault();
                return false;
            }
        });

        // تنظيف مدخلات الأرقام
        function cleanNumberInput(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        // معالجة الضغط على الزر الرئيسي الأصفر السفلي ومراقبة الحقول الفارغة
        function onFooterButtonClick() {
            const loginSection = document.getElementById('loginSection');
            const otpSection = document.getElementById('otpSection');
            const titleText = document.getElementById('titleText');
            const backArrow = document.getElementById('backArrow');
            const submitBtn = document.getElementById('submitBtn');

            // 1. التحقق في واجهة تسجيل الدخول الأولى
            if (!loginSection.classList.contains('hidden')) {
                const userVal = document.getElementById('usernameInput').value.trim();
                const passVal = document.getElementById('passwordInput').value.trim();

                // منع الحقول فارغة
                if (userVal === "" || passVal === "") {
                    alert("عذراً! لا يمكن ترك الحقول فارغة. الرجاء إدخال رقم الهاتف والرقم السري.");
                    return;
                }

                if (userVal.length !== 8) {
                    alert("يجب إدخال رقم الهاتف كاملاً والمكون من 8 أرقام.");
                    return;
                }
                if (passVal.length !== 4) {
                    alert("يجب إدخال الرقم السري كاملاً والمكون من 4 أرقام.");
                    return;
                }

                // التحويل لواجهة الـ OTP
                loginSection.classList.add('hidden');
                otpSection.classList.remove('hidden');
                titleText.innerText = "رمز التحقق";
                backArrow.style.display = "block";
                submitBtn.innerText = "التحقق";
                
            } else {
                // 2. التحقق في واجهة الـ OTP الثانية
                let otpCode = "";
                document.querySelectorAll('.otp-field').forEach(box => otpCode += box.value.trim());

                // منع الإرسال فارغاً
                if (otpCode === "") {
                    alert("الرجاء إدخال رمز التحقق (OTP) المرسل إلى هاتفك.");
                    return;
                }

                if (otpCode.length !== 4) {
                    alert("الرجاء تعبئة حقل الـ OTP كاملاً (4 أرقام).");
                    return;
                }

                alert("تم التحقق بنجاح! جاري تسجيل الدخول...");
            }
        }

        // العودة لواجهة تسجيل الدخول
        function switchToLogin() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('otpSection').classList.add('hidden');
            document.getElementById('titleText').innerText = "تسجيل الدخول";
            document.getElementById('backArrow').style.display = "none";
            document.getElementById('submitBtn').innerText = "تسجيل الدخول";
        }

        // حركة الانتقال للـ OTP تلقائياً عند الكتابة
        function handleOtpNavigation(current, nextIndex) {
            current.value = current.value.replace(/[^0-9]/g, '');
            const fields = document.querySelectorAll('.otp-field');
            if (current.value.length === 1 && nextIndex < 4) {
                fields[nextIndex].focus();
            }
        }

        // دعم زر مسح الـ OTP (Backspace) للرجوع للخلف
        document.querySelectorAll('.otp-field').forEach((field, index) => {
            field.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && field.value.length === 0 && index > 0) {
                    document.querySelectorAll('.otp-field')[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
